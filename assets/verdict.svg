<svg xmlns="http://www.w3.org/2000/svg" width="840" height="318" viewBox="0 0 840 318" role="img" aria-labelledby="t d">
  <title id="t">recusal check philip-paz</title>
  <desc id="d">A terminal runs recusal on Philip. Evidence: 20 years in financial services and regulated data, PASS. Builds deterministic guardrails for AI agents, PASS. Guitars, motocross, PASS. Claim "10x engineer", REFUSE, no evidence provided. Claim "AI agents should act with no one watching", REFUSE, hand stays on the reins. Verdict: ALLOW, human in the loop.</desc>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; fill: #c9d1d9; }
    .k { fill: #8b949e; }
    .p { fill: #3fb950; font-weight: 700; }
    .r { fill: #f85149; font-weight: 700; }
    .why { fill: #ff7b72; }
    .a { fill: #58a6ff; font-weight: 700; }
    .dim { fill: #6e7681; font-size: 12.5px; }
    .prompt { fill: #3fb950; }
    .line { opacity: 0; animation: show .35s ease-out forwards; }
    .stamp { opacity: 0; transform-box: fill-box; transform-origin: center; animation: stamp .45s cubic-bezier(.2,1.6,.4,1) forwards; }
    .cursor { opacity: 0; animation: show .01s forwards, blink 1.1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes stamp { 0% { opacity: 0; transform: scale(1.9) rotate(-8deg); } 60% { opacity: 1; transform: scale(.94) rotate(2deg); } 100% { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .stamp, .cursor { animation: none; opacity: 1; } }
  </style>
  <defs>
    <clipPath id="type"><rect x="40" y="46" width="0" height="26"><animate attributeName="width" from="0" to="230" begin="0.3s" dur="1.3s" fill="freeze" calcMode="discrete" values="0;18;35;52;69;86;103;120;137;154;171;188;205;222;230"/></rect></clipPath>
  </defs>

  <rect width="840" height="318" rx="12" fill="#0d1117"/>
  <rect width="840" height="34" rx="12" fill="#161b22"/>
  <rect y="22" width="840" height="12" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f57"/><circle cx="42" cy="17" r="6" fill="#febc2e"/><circle cx="62" cy="17" r="6" fill="#28c840"/>
  <text x="420" y="22" text-anchor="middle" class="dim">philpaz ~ recusal</text>

  <text x="24" y="66" class="prompt">$</text>
  <text x="40" y="66" clip-path="url(#type)">recusal check philip-paz</text>

  <g class="line" style="animation-delay:1.9s">
    <text x="24" y="104" class="k">evidence</text><text x="112" y="104">20 years in financial services and regulated data</text>
  </g>
  <text x="560" y="104" class="p stamp" style="animation-delay:2.2s">PASS</text>

  <g class="line" style="animation-delay:2.6s">
    <text x="24" y="132" class="k">evidence</text><text x="112" y="132">builds deterministic guardrails for AI agents</text>
  </g>
  <text x="560" y="132" class="p stamp" style="animation-delay:2.9s">PASS</text>

  <g class="line" style="animation-delay:3.3s">
    <text x="24" y="160" class="k">evidence</text><text x="112" y="160">guitars, motocross</text>
  </g>
  <text x="560" y="160" class="p stamp" style="animation-delay:3.6s">PASS</text>

  <g class="line" style="animation-delay:4.1s">
    <text x="24" y="188" class="k">claim</text><text x="112" y="188">"10x engineer"</text>
  </g>
  <text x="560" y="188" class="r stamp" style="animation-delay:4.5s">REFUSE</text>
  <text x="626" y="188" class="why line" style="animation-delay:4.8s">no evidence provided</text>

  <g class="line" style="animation-delay:5.3s">
    <text x="24" y="216" class="k">claim</text><text x="112" y="216">"AI agents should act with no one watching"</text>
  </g>
  <text x="560" y="216" class="r stamp" style="animation-delay:5.7s">REFUSE</text>
  <text x="626" y="216" class="why line" style="animation-delay:6.0s">hand stays on the reins</text>

  <g class="line" style="animation-delay:6.7s">
    <text x="24" y="256" class="k">verdict</text><text x="112" y="256" class="a">ALLOW</text><text x="168" y="256">(human in the loop)</text>
  </g>

  <g class="line" style="animation-delay:7.4s">
    <text x="24" y="290" class="dim">record   sha256:9475c1b34e8b…fcb513c1d883  of verdict.txt, check it yourself</text>
  </g>
  <rect x="24" y="298" width="9" height="3" fill="#c9d1d9" class="cursor" style="animation-delay:7.8s"/>
</svg>
