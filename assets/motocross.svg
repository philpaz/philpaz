<svg xmlns="http://www.w3.org/2000/svg" width="560" height="240" viewBox="0 0 560 240" role="img" aria-labelledby="t d">
  <title id="t">No helmet, no entry</title>
  <desc id="d">A small robot on a dirt bike rolls up to a striped gate. The sign on the gate says REFUSE, no helmet. The robot says: but I'm autonomous!</desc>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bike { animation: ride 1.5s cubic-bezier(.15,.8,.3,1) both; }
    .bob { animation: bob .5s ease-in-out 1.5s 2 alternate; }
    .sign { opacity: 0; transform-box: fill-box; transform-origin: center; animation: stamp .5s cubic-bezier(.2,1.6,.4,1) 1.6s forwards; }
    .bubble { opacity: 0; animation: fade .4s ease-out 2.3s forwards; }
    .dust { opacity: 0; animation: dust 1.2s ease-out .9s forwards; }
    .led { animation: blink 1.2s steps(1) infinite; }
    @keyframes ride { from { transform: translateX(-240px); } to { transform: translateX(0); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-3px); } }
    @keyframes stamp { 0% { opacity: 0; transform: scale(1.8) rotate(-10deg); } 60% { opacity: 1; transform: scale(.95) rotate(3deg); } 100% { opacity: 1; transform: rotate(-3deg); } }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes dust { 0% { opacity: .8; transform: translateX(0); } 100% { opacity: 0; transform: translateX(-30px); } }
    @keyframes blink { 0%, 60% { fill: #f85149; } 61%, 100% { fill: #ffb3ad; } }
    @media (prefers-reduced-motion: reduce) { .bike, .bob, .sign, .bubble, .dust { animation: none; opacity: 1; } .dust { opacity: 0; } .sign { transform: rotate(-3deg); } }
  </style>
  <defs>
    <pattern id="stripes" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="24" height="24" fill="#ffffff"/><rect width="12" height="24" fill="#cf222e"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="558" height="238" rx="14" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <line x1="24" y1="202" x2="536" y2="202" stroke="#bf8700" stroke-width="3" stroke-linecap="round" stroke-dasharray="14 6"/>

  <!-- the gate -->
  <rect x="455" y="84" width="12" height="118" rx="3" fill="#57606a"/>
  <rect x="275" y="130" width="184" height="14" rx="4" fill="url(#stripes)" stroke="#57606a" stroke-width="2"/>
  <circle cx="461" cy="137" r="7" fill="#57606a"/>
  <g class="sign">
    <rect x="396" y="26" width="130" height="50" rx="7" fill="#cf222e"/>
    <text x="461" y="50" text-anchor="middle" class="sans" font-size="19" font-weight="800" fill="#ffffff" letter-spacing="1">REFUSE</text>
    <text x="461" y="67" text-anchor="middle" class="sans" font-size="12.5" fill="#ffffff">no helmet</text>
  </g>

  <!-- dust left behind -->
  <g class="dust" fill="#d8c3a5">
    <circle cx="58" cy="190" r="9"/><circle cx="42" cy="184" r="6"/><circle cx="70" cy="180" r="5"/>
  </g>

  <!-- rider and bike -->
  <g class="bike"><g class="bob">
    <!-- wheels -->
    <circle cx="100" cy="176" r="27" fill="none" stroke="#24292f" stroke-width="4" stroke-dasharray="4 4"/>
    <circle cx="100" cy="176" r="22" fill="none" stroke="#24292f" stroke-width="7"/>
    <circle cx="100" cy="176" r="5" fill="#57606a"/>
    <circle cx="212" cy="176" r="27" fill="none" stroke="#24292f" stroke-width="4" stroke-dasharray="4 4"/>
    <circle cx="212" cy="176" r="22" fill="none" stroke="#24292f" stroke-width="7"/>
    <circle cx="212" cy="176" r="5" fill="#57606a"/>
    <!-- frame, engine, fork -->
    <path d="M100 176 L138 144 L186 144 L212 176" fill="none" stroke="#fb8500" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="140" y="146" width="30" height="20" rx="4" fill="#8c959f"/>
    <line x1="212" y1="176" x2="198" y2="116" stroke="#57606a" stroke-width="6" stroke-linecap="round"/>
    <line x1="188" y1="113" x2="208" y2="113" stroke="#24292f" stroke-width="5" stroke-linecap="round"/>
    <path d="M190 150 Q212 140 234 152" fill="none" stroke="#fb8500" stroke-width="6" stroke-linecap="round"/>
    <path d="M118 140 L170 134 L176 144 L122 146 Z" fill="#24292f"/>
    <ellipse cx="203" cy="128" rx="9" ry="7" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
    <text x="203" y="132" text-anchor="middle" class="sans" font-size="9" font-weight="700" fill="#24292f">AI</text>
    <!-- robot, helmetless -->
    <path d="M150 132 L158 152 L174 154" fill="none" stroke="#57606a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="132" y="92" width="36" height="42" rx="7" fill="#8c959f" stroke="#57606a" stroke-width="2"/>
    <circle cx="150" cy="112" r="5" fill="#0969da"/>
    <line x1="164" y1="102" x2="194" y2="113" stroke="#57606a" stroke-width="6" stroke-linecap="round"/>
    <rect x="133" y="56" width="34" height="30" rx="7" fill="#d0d7de" stroke="#57606a" stroke-width="2"/>
    <circle cx="144" cy="71" r="3.5" fill="#0969da"/><circle cx="157" cy="71" r="3.5" fill="#0969da"/>
    <path d="M144 79 Q150 82 157 79" fill="none" stroke="#57606a" stroke-width="2" stroke-linecap="round"/>
    <line x1="150" y1="56" x2="150" y2="44" stroke="#57606a" stroke-width="2.5"/>
    <circle cx="150" cy="41" r="4.5" class="led" fill="#f85149"/>
  </g></g>

  <!-- the robot's defense -->
  <g class="bubble">
    <rect x="186" y="20" width="176" height="34" rx="17" fill="#ffffff" stroke="#57606a" stroke-width="2"/>
    <path d="M204 52 L186 66 L216 53" fill="#ffffff" stroke="#57606a" stroke-width="2" stroke-linejoin="round"/>
    <rect x="200" y="48" width="18" height="5" fill="#ffffff"/>
    <text x="274" y="42" text-anchor="middle" class="sans" font-size="14" fill="#24292f">but I'm autonomous!</text>
  </g>
</svg>
